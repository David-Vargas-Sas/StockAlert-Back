spring:
  datasource:
    url: jdbc:h2:mem:stockalert-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

stockalert:
  security:
    jwt-secret: stockalert-test-secret-key
    jwt-expiration-minutes: 480
    refresh-token-expiration-days: 7
  bootstrap:
    company-name: StockAlert
    super-admin-username: superadmin
    super-admin-email: superadmin@stockalert.local
    super-admin-password: Admin123*
